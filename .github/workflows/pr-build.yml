# PR build (OSS). Product-only compile gate; tests and signing run in internal ADO.

name: Fork native product and focused tests

on:
  pull_request:
    branches:
      - main
      - winui3/main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/policies/**'
      - 'LICENSE'
      - 'NOTICE.md'
      - 'PRIVACY.md'
      - 'privacy.md'
      - 'SECURITY.md'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - 'CONTRIBUTING_feedback_and_requests.md'
  workflow_dispatch: {}

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DISABLE_PR_BUILD_MATRIX_VALIDATION: 'false'

jobs:
  build:
    name: Build (${{ matrix.flavor }})
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: x64chk
            platform: x64
            configuration: Debug
    env:
      WINUI_INIT_FLAVOR: ${{ matrix.flavor }}
      WINUI_BUILD_PLATFORM: ${{ matrix.platform }}
      WINUI_BUILD_CONFIGURATION: ${{ matrix.configuration }}
      BuildPlatform: ${{ matrix.platform }}
      NUGET_PACKAGES: ${{ github.workspace }}\packages
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      # Cap CL.exe parallelism: hosted runner has 2 vCPUs; default /m:4 OOMs (C1076).
      CL: '/MP2'

    steps:
      - name: Skip disabled PR Build validation
        if: env.DISABLE_PR_BUILD_MATRIX_VALIDATION == 'true'
        shell: pwsh
        run: Write-Host "PR Build matrix validation is disabled by DISABLE_PR_BUILD_MATRIX_VALIDATION."

      - name: Checkout
        if: env.DISABLE_PR_BUILD_MATRIX_VALIDATION != 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          show-progress: false

      - name: Build product and tests with repository build skill
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lp = 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'
          if ((Get-ItemProperty -Path $lp -Name LongPathsEnabled).LongPathsEnabled -ne 1) {
            New-ItemProperty -Path $lp -Name LongPathsEnabled -Value 1 -PropertyType DWord -Force | Out-Null
          }
          foreach ($v in 'ACTIONS_RUNTIME_TOKEN','ACTIONS_RUNTIME_URL','ACTIONS_RESULTS_URL','ACTIONS_CACHE_URL','ACTIONS_ID_TOKEN_REQUEST_TOKEN','ACTIONS_ID_TOKEN_REQUEST_URL','GITHUB_TOKEN') {
            Remove-Item "env:$v" -ErrorAction SilentlyContinue
          }
          & .\init.ps1 amd64chk /nopgo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\initrun.ps1 .\build.cmd /q /b
          exit $LASTEXITCODE

      - name: Assemble native test payload
        shell: pwsh
        run: |
          & .\initrun.ps1 powershell -ExecutionPolicy Bypass -File test\CreateTestPayload.ps1 -Platform x64 -Configuration chk -SkipSymbols -SkipWinUIGallery
          exit $LASTEXITCODE

      - name: Upload native test payload
        uses: actions/upload-artifact@v6
        with:
          name: winui-native-tests-x64chk
          path: TestPayload/x64chk/**
          if-no-files-found: error
          retention-days: 7

      - name: Run focused native tests on the disposable cloud desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repoRoot = (Get-Location).Path
          $out = Join-Path $repoRoot 'native-test-output'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          dotnet --list-runtimes | Set-Content (Join-Path $out 'runtimes.txt')
          Get-FileHash TestPayload/x64chk/Test/Microsoft.UI.Xaml.dll -Algorithm SHA256 | ConvertTo-Json | Set-Content (Join-Path $out 'native-product-hash.json')
          foreach ($v in 'ACTIONS_RUNTIME_TOKEN','ACTIONS_RUNTIME_URL','ACTIONS_RESULTS_URL','ACTIONS_CACHE_URL','ACTIONS_ID_TOKEN_REQUEST_TOKEN','ACTIONS_ID_TOKEN_REQUEST_URL','GITHUB_TOKEN') {
            Remove-Item "env:$v" -ErrorAction SilentlyContinue
          }
          $cases = @(
            @{id='first-line-alignment'; dll='Test\Microsoft.UI.Xaml.Tests.External.Controls.dll'; name='Microsoft::UI::Xaml::Tests::Controls::CheckBox::CheckBoxIntegrationTests::AlignsSelectionGlyphWithFirstLabelLine'},
            @{id='checkbox-visual-tree'; dll='Test\Microsoft.UI.Xaml.Tests.External.Controls.dll'; name='Microsoft::UI::Xaml::Tests::Controls::CheckBox::CheckBoxIntegrationTests::ValidateUIElementTree'},
            @{id='radiobutton-visual-tree'; dll='Test\Microsoft.UI.Xaml.Tests.External.Controls.dll'; name='Microsoft::UI::Xaml::Tests::Controls::RadioButton::RadioButtonIntegrationTests::ValidateUIElementTree'},
            @{id='checkbox-high-contrast-dcomp'; dll='Test\Microsoft.UI.Xaml.Tests.External.Foundation.dll'; name='Microsoft::UI::Xaml::Tests::Foundation::Graphics::HighContrastAdjustmentTests::VerifyCheckBoxDCompTree'}
          )
          $results = @()
          Push-Location TestPayload/x64chk
          try {
            foreach ($case in $cases) {
              $dir = Join-Path $out $case.id
              New-Item -ItemType Directory -Force -Path $dir | Out-Null
              $select = "/select:@Name='$($case.name)'"
              $list = & .\te.exe $case.dll '/p:HostingMode=WPF' '/p:SkipConsoleWindowMinimize' $select /list 2>&1
              $listExit = $LASTEXITCODE
              $list | Set-Content (Join-Path $dir 'list.txt')
              $names = @($list | ForEach-Object { $_.ToString().Trim() } | Where-Object { $_ -match '^Microsoft::UI::Xaml::Tests::[A-Za-z0-9_:]+$' })
              $class = $case.name.Substring(0, $case.name.LastIndexOf('::'))
              $unexpected = @($names | Where-Object { $_ -cne $case.name -and $_ -cne $class })
              if ($listExit -ne 0 -or $case.name -cnotin $names -or $unexpected.Count -gt 0) {
                $results += @{id=$case.id; listExit=$listExit; executed=$false; reason='Selection not verified'; names=$names}
                continue
              }
              & .\te.exe $case.dll '/p:HostingMode=WPF' '/p:SkipConsoleWindowMinimize' $select /labMode /enableWttLogging "/logFile:$($case.id).wtl" "/outputFolder:$dir" '/testTimeout:00:03:00' '/sessionTimeout:00:10:00' 2>&1 | Tee-Object -FilePath (Join-Path $dir 'run.txt')
              $results += @{id=$case.id; listExit=$listExit; executed=$true; exit=$LASTEXITCODE; name=$case.name}
            }
          } finally {
            Pop-Location
            $results | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $out 'results.json')
            $candidates = @(
              (Join-Path $env:USERPROFILE 'Pictures\XamlTAEFOutput'),
              'C:\Windows\System32\config\systemprofile\Pictures\XamlTAEFOutput'
            )
            $pictures = [Environment]::GetFolderPath('MyPictures')
            if ($pictures) { $candidates += Join-Path $pictures 'XamlTAEFOutput' }
            $candidates = $candidates | Select-Object -Unique
            $index=0
            foreach($candidate in $candidates) {
              if(Test-Path -LiteralPath $candidate) {
                Copy-Item -LiteralPath $candidate -Destination (Join-Path $out "generated-masters-$index") -Recurse
                $index++
              }
            }
          }
          if ($results.Count -ne 4 -or @($results | Where-Object { -not $_.executed -or $_.exit -ne 0 }).Count -gt 0) { exit 1 }

      - name: Upload native test results and generated masters
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-test-results-x64chk
          path: native-test-output/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload MSBuild binlogs
        if: failure() && env.DISABLE_PR_BUILD_MATRIX_VALIDATION != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: binlogs-${{ matrix.flavor }}
          path: BuildOutput/**/*.binlog
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload product runtime payload
        if: env.DISABLE_PR_BUILD_MATRIX_VALIDATION != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: winui-product-${{ matrix.flavor }}
          path: |
            BuildOutput/packaging/${{ matrix.configuration }}/runtimes-framework/win-${{ matrix.platform }}/**
          if-no-files-found: warn
          retention-days: 7
